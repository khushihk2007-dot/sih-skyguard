# ── The Witness Network – Nginx Configuration ──
# Serves the Vite-built SPA and proxies /api to the backend container.

server {
    listen 80;
    server_name _;

    # ── Serve React SPA static files ─────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse-proxy /api → backend container ───────────────────────
    # Docker Compose DNS resolves "backend" to the backend container IP
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for slow predictions / large responses
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Also proxy /health and /docs ─────────────────────────────────
    location /health {
        proxy_pass http://backend:8000;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /redoc {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # ── Gzip compression for faster loads ────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
